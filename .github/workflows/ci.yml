name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: build + test (macOS 26, Xcode)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - run: swift build -c release
      - run: swift test

  test-sonoma:
    name: build + test (macOS 14, swift.org toolchain)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install Swift 6.2
        run: |
          curl -fsSLO https://download.swift.org/swift-6.2.4-release/xcode/swift-6.2.4-RELEASE/swift-6.2.4-RELEASE-osx.pkg
          installer -pkg swift-6.2.4-RELEASE-osx.pkg -target CurrentUserHomeDirectory
      - run: make build
      - run: make test
